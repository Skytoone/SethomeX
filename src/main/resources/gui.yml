# -------------------------------------------------------------------------#
#                       GUI Configuration - SethomeX                       #  
# -------------------------------------------------------------------------#
# All graphical interfaces can be customized here.
# Supports MiniMessage (<red>, <bold>) and Legacy Color Codes (&e, &a).

menus:
  # -- MENU PRINCIPAL (Mes Homes) --
  main:
    title: "&e&lSethomeX &8» &fMy Homes"
    title-folder: "&e&lSethomeX &8» &fFolder: &6{folder}"
    items:
      folder:
        name: "&e&l📁 {category}"
        lore:
          - "&7&m------------------------"
          - "&7Homes inside: &f{count}"
          - "&7&m------------------------"
          - "&e➔ Click: &aOpen Folder"
          - "&7&m------------------------"
      # Affichage d'une habitation personnelle
      home:
        name: "&b&l{name}"
        lore:
          - "&7&m------------------------"
          - "&7Coordinates: &f{world} ({x}, {y}, {z})"
          - "&7Status: {status}"
          - "&7Respawn: {respawn}"
          - "&7&m------------------------"
          - "&e➔ Left Click : &aTeleport"
          - "&6➔ Right Click : &fModify Icon"
          - "&d➔ Shift+Left : &eToggle Public"
          - "&b➔ Shift+Middle : &3Set as Respawn"
          - "&c➔ Shift+Right : &4Delete"
          - "&a➔ Drop Key (Q) : &dHome Settings"
          - "&7&m------------------------"
      
      # Statuts d'état (utilisés dans le placeholder {status} et {respawn})
      status-public: "&aPUBLIC"
      status-private: "&cPRIVATE"
      respawn-yes: "&a✔ YES"
      respawn-no: "&7✘ NO"
      
      # Boutons de navigation et infos
      info-book:
        name: "&6&lHelp & Information"
        lore:
          - "&7&m------------------------"
          - "&7Total Homes: &e{count}/{limit}"
          - "&7&m------------------------"
          - "&fManage your quick travel points"
          - "&fhere. Click icons to travel."
      
      public-catalog:
        name: "&d&l🌍 Public Catalog"
        lore:
          - "&7Click here to explore"
          - "&7homes opened by the community."
      
      shared-homes:
        name: "&b&l🤝 Shared Homes"
        lore:
          - "&7Explore homes shared"
          - "&7with you by friends!"
      
      effects:
        name: "&d&l✨ Teleport Effects"
        lore:
          - "&7Personalize your teleport style,"
          - "&7particles, and sound effects!"
          - ""
          - "&e➔ Click: &aOpen Selector"

  # -- CATALOGUE PUBLIC --
  public-catalog:
    title: "&e&lSethomeX &8» &dCatalog"
    items:
      home:
        name: "&d&l{name}"
        lore:
          - "&7&m------------------------"
          - "&7Owner: &f{owner}"
          - "&7Visits: &e{visits}"
          - "&7Likes: &b👍 {likes}"
          - "&7Visit Fee: &6{fee}"
          - "&7Description: &f{description}"
          - "&7&m------------------------"
          - "&e➔ Left Click: &aVisit this home"
          - "&b➔ Right Click: &bLike / Unlike"
          - "&d➔ Shift+Right: &dPreview home (5s)"
          - "&7&m------------------------"
      
      info:
        name: "&d&lPublic Exploration"
        lore:
          - "&7Shared homes: &e{count}"
          - "&7Ranking: &f{ranking}"
      
      sorting:
        name: "&6&l⚙️ Sorting Settings"
        lore:
          - "&7&m------------------------"
          - "&7Currently sorted by:"
          - " {mode}"
          - "&7&m------------------------"
          - "&e➔ Click: &fChange sort mode"
          - "&7&m------------------------"
      
      sort-modes:
        popularity: "&dBy Popularity &7(Visits)"
        alphabetical: "&aAlphabetical &7(A-Z)"
        random: "&eRandom"
        likes: "&bBy Likes &7(👍)"

  # -- HOMES PARTAGÉS (Invités) --
  shared:
    title: "&e&lSethomeX &8» &bShared"
    items:
      home:
        name: "&b&l{name}"
        lore:
          - "&7&m------------------------"
          - "&7Owner: &e{owner}"
          - "&7&m------------------------"
          - "&e➔ Left Click: &aJoin"
          - "&7&m------------------------"

  # -- MENU SÉLECTION D'ICÔNES --
  icon-selector:
    title: "&8» Choose an icon"
    
    # Functional list of standard materials
    icons:
      - "RED_BED"
      - "COMPASS"
      - "GRASS_BLOCK"
      - "NETHERITE_SWORD"
      - "CHEST"
      - "CAMPFIRE"
      - "OAK_LOG"
      - "BOOKSHELF"
      - "WATER_BUCKET"
      - "ENDER_PEARL"
      - "GOLD_INGOT"
      - "DIAMOND"
      - "PLAYER_HEAD"

